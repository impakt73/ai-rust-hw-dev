[package]
name = "riscv_shared"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", default-features = false, features = ["derive"] }
postcard = { version = "1.0", default-features = false, optional = true }

[features]
default = ["std"]
std = ["serde/std", "alloc"]
alloc = ["postcard", "postcard?/alloc"]

[dev-dependencies]
serde = { version = "1.0", features = ["derive"] }
postcard = "1.0"
