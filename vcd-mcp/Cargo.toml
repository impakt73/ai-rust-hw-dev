[package]
name = "vcd-mcp"
version = "0.1.0"
edition = "2021"

[dependencies]
# Async Runtime
tokio = { version = "1.0", features = ["full"] }

# MCP Protocol Implementation
rmcp = { version = "0.12", features = ["transport-io"] }

# VCD Parsing
vcd = "0.7"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error Handling & Utils
anyhow = "1.0"
thiserror = "1.0"
schemars = "1.2"
lazy_static = "1.4"

[dev-dependencies]
tempfile = "3.0"
