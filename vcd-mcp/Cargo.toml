[package]
name = "vcd-mcp"
version = "0.1.0"
edition = "2021"

[dependencies]
# Async Runtime
tokio = { version = "1.0", features = ["full"] }

# MCP Protocol Implementation
rmcp = { version = "0.1", features = ["server", "macros", "transport-io"] }

# VCD Parsing
vcd = "0.6"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error Handling & Utils
anyhow = "1.0"
thiserror = "1.0"
schemars = "0.8"

[dev-dependencies]
tempfile = "3.0"
