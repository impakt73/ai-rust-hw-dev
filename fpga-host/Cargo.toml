[package]
name = "fpga-host"
version = "0.1.0"
edition = "2021"
description = "FPGA host interface for RISC-V CPU over serial connection"

[[bin]]
name = "fpga-host"
path = "src/main.rs"

[dependencies]
bus-shared = { path = "../bus-shared" }
clap = { version = "4.4", features = ["derive"] }
device-runtime = { path = "../device-runtime" }
host-bus-handler = { path = "../host-bus-handler" }
log = "0.4"
riscv_shared = { path = "../riscv_shared" }
shell-words = "1.1"

# TUI dependencies
ratatui = "0.29"
crossterm = "0.28"
