[package]
name = "fpga-host"
version = "0.1.0"
edition = "2021"
description = "FPGA host interface for RISC-V CPU over serial connection"

[[bin]]
name = "fpga-host"
path = "src/main.rs"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
elf = "0.7"
log = "0.4"
serialport = "4.6"
riscv_shared = { path = "../riscv_shared" }

# TUI dependencies
ratatui = "0.29"
crossterm = "0.28"
