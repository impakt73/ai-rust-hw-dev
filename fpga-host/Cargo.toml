[package]
name = "fpga-host"
version = "0.1.0"
edition = "2021"
description = "FPGA host interface for RISC-V CPU over serial connection"

[[bin]]
name = "fpga-host"
path = "src/main.rs"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
elf = "0.7"
log = "0.4"
env_logger = "0.10"
serialport = "4.6"
ctrlc = "3.4"
riscv_shared = { path = "../riscv_shared" }
