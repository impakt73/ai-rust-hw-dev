[package]
name = "rust-test-program"
version = "0.1.0"
edition = "2021"

# This package has its own workspace to avoid conflicts with the main workspace
[workspace]

[[bin]]
name = "rust_test"
path = "src/main.rs"
test = false

[[bin]]
name = "hello_world"
path = "src/hello_world.rs"
test = false

[[bin]]
name = "packet_test"
path = "src/packet_test.rs"
test = false

[[bin]]
name = "simple_test"
path = "src/simple_test.rs"
test = false

[dependencies]
riscv-rt = "0.17.0"
riscv_protocol = { path = "../riscv_protocol", default-features = false, features = ["alloc"] }
riscv_macros = { path = "../riscv_macros", default-features = false }
serde = { version = "1.0", default-features = false, features = ["derive"] }
postcard = { version = "1.0", default-features = false, features = ["alloc"] }

[[bin]]
name = "simple_fifo_test"
path = "src/simple_fifo_test.rs"
test = false

[[bin]]
name = "minimal_postcard_test"
path = "src/minimal_postcard_test.rs"
test = false

[[bin]]
name = "minimal_postcard_test2"
path = "src/minimal_postcard_test2.rs"
test = false

[[bin]]
name = "minimal_debug_test"
path = "src/minimal_debug_test.rs"
test = false

[[bin]]
name = "test_allocator"
path = "src/test_allocator.rs"
test = false

[[bin]]
name = "test_heap_directly"
path = "src/test_heap_directly.rs"
test = false

[[bin]]
name = "test_stack_memory"
path = "src/test_stack_memory.rs"
test = false

[[bin]]
name = "test_static_heap"
path = "src/test_static_heap.rs"
test = false

[[bin]]
name = "test_byte_store_simple"
path = "src/test_byte_store_simple.rs"
test = false

[[bin]]
name = "test_alloc_only"
path = "src/test_alloc_only.rs"
test = false

[[bin]]
name = "println_test"
path = "src/println_test.rs"
test = false

[[bin]]
name = "test_minimal_halt"
path = "src/test_minimal_halt.rs"
test = false

[[bin]]
name = "test_one_println"
path = "src/test_one_println.rs"
test = false

[[bin]]
name = "test_memory_pattern"
path = "src/test_memory_pattern.rs"
