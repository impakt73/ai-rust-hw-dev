[package]
name = "rust-test-program"
version = "0.1.0"
edition = "2021"

# This package has its own workspace to avoid conflicts with the main workspace
[workspace]

[[bin]]
name = "rust_test"
path = "src/main.rs"
test = false

[[bin]]
name = "hello_world"
path = "src/hello_world.rs"
test = false

[[bin]]
name = "packet_test"
path = "src/packet_test.rs"
test = false

[[bin]]
name = "simple_test"
path = "src/simple_test.rs"
test = false

[dependencies]
riscv-rt = "0.17.0"
riscv_protocol = { path = "../riscv_protocol", default-features = false, features = ["alloc"] }
rkyv = { version = "0.8", default-features = false, features = ["alloc", "bytecheck"] }

[[bin]]
name = "simple_fifo_test"
path = "src/simple_fifo_test.rs"
test = false
