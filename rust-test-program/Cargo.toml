[package]
name = "rust-test-program"
version = "0.1.0"
edition = "2021"

# This package has its own workspace to avoid conflicts with the main workspace
[workspace]

[[bin]]
name = "rust_test"
path = "src/main.rs"
test = false

[[bin]]
name = "hello_world"
path = "src/hello_world.rs"
test = false

[[bin]]
name = "simple_test"
path = "src/simple_test.rs"
test = false

[profile.release]
panic = "abort"

[dependencies]
riscv-rt = { version = "0.17.0", features = ["no-mhartid"] }
riscv = { version = "0.16.0", features = ["critical-section-single-hart"] }
critical-section = "1.2.0"
embedded-alloc = "0.6.0"
riscv_shared = { path = "../riscv_shared", default-features = false }
ufmt = "0.2"

[[bin]]
name = "test_allocator"
path = "src/test_allocator.rs"
test = false

[[bin]]
name = "test_heap_directly"
path = "src/test_heap_directly.rs"
test = false

[[bin]]
name = "test_stack_memory"
path = "src/test_stack_memory.rs"
test = false

[[bin]]
name = "test_byte_store_simple"
path = "src/test_byte_store_simple.rs"
test = false

[[bin]]
name = "test_alloc_only"
path = "src/test_alloc_only.rs"
