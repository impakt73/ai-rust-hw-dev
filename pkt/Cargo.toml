[package]
name = "pkt"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.0"
walkdir = "2.5"
zip = { version = "8.2.0", default-features = false, features = ["deflate"] }
