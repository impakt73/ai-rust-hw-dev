[package]
name = "sim-view"
version = "0.1.0"
edition = "2021"

[lib]
name = "sim_view"
path = "src/lib.rs"

[[bin]]
name = "sim-view"
path = "src/main.rs"

[dependencies]
# Core simulation
cpu-sim = { path = "../cpu-sim" }
riscv_core = { path = "../riscv_core" }
riscv_shared = { path = "../riscv_shared" }

# GUI and Audio
softbuffer = "0.4"
winit = "0.30"
cpal = "0.15"

# CLI and logging
clap = { version = "4.4", features = ["derive"] }
log = "0.4"
env_logger = "0.10"
