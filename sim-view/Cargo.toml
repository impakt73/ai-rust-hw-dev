[package]
name = "sim-view"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "sim-view"
path = "src/main.rs"

[dependencies]
# Core simulation
cpu-sim = { path = "../cpu-sim" }
riscv_core = { path = "../riscv_core" }

# GUI and Audio
minifb = "0.27"
cpal = "0.15"

# CLI and logging
clap = { version = "4.4", features = ["derive"] }
log = "0.4"
env_logger = "0.10"
