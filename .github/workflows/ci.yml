name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      FPGA_TOOL_CACHE_VERSION: v4
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Cache and install system packages
      uses: awalsh128/cache-apt-pkgs-action@v1
      with:
        packages: verilator libasound2-dev libudev-dev yosys fpga-icestorm nextpnr-ice40 fpga-trellis fpga-trellis-database nextpnr-ecp5 openfpgaloader squashfs-tools patchelf cmake libboost-iostreams-dev libboost-thread-dev libboost-program-options-dev libboost-python-dev libboost-filesystem-dev libboost-system-dev libboost-regex-dev libboost-chrono-dev libboost-atomic-dev libeigen3-dev python3-pip
        # Bump version (v3 -> v4) to force cache refresh
        version: v4
    
    - name: Install Artix-7 (openXC7) tooling
      run: |
        sudo mkdir -p /opt/openxc7/share/nextpnr-xilinx
        wget -O /tmp/openxc7_0.8.2_amd64.snap https://github.com/openXC7/openXC7-snap/releases/download/0.8.2/openxc7_0.8.2_amd64.snap
        sudo unsquashfs -f -d /opt/openxc7 /tmp/openxc7_0.8.2_amd64.snap

        python3 -m pip install --user git+https://github.com/f4pga/prjxray.git
        git clone --depth 1 https://github.com/f4pga/prjxray.git /tmp/prjxray-src
        sudo mv /tmp/prjxray-src /opt/openxc7/prjxray-src
        PYTHON_USER_SITE="$(python3 -c 'import site; print(site.getusersitepackages())')"

        for tool in nextpnr-xilinx bbasm xc7frames2bit; do
          sudo cp "/opt/openxc7/usr/bin/${tool}" "/usr/local/bin/${tool}.real"
          sudo patchelf --set-interpreter /lib64/ld-linux-x86-64.so.2 "/usr/local/bin/${tool}.real"
          printf '%s\n' '#!/usr/bin/env bash' "LD_LIBRARY_PATH=/opt/openxc7/usr/lib/x86_64-linux-gnu:/opt/openxc7/lib/x86_64-linux-gnu exec /usr/local/bin/${tool}.real \"\$@\"" | sudo tee "/usr/local/bin/${tool}" >/dev/null
          sudo chmod +x "/usr/local/bin/${tool}"
        done

        printf '%s\n' '#!/usr/bin/env bash' "PYTHONPATH=/opt/openxc7/prjxray-src:${PYTHON_USER_SITE} exec python3 /opt/openxc7/prjxray-src/utils/fasm2frames.py --db-root /opt/openxc7/opt/nextpnr-xilinx/external/prjxray-db \"\$@\"" | sudo tee /usr/local/bin/fasm2frames >/dev/null
        sudo chmod +x /usr/local/bin/fasm2frames

        CHIPDB_BBA="$(mktemp /tmp/xc7a35tcsg324-1.XXXXXX.bba)"
        trap 'rm -f "${CHIPDB_BBA}"' EXIT
        python3 /opt/openxc7/opt/nextpnr-xilinx/python/bbaexport.py --device xc7a35tcsg324-1 --bba "${CHIPDB_BBA}"
        bbasm -l "${CHIPDB_BBA}" /opt/openxc7/share/nextpnr-xilinx/xc7a35tcsg324-1.bin

    - name: Verify Verilator installation
      run: verilator --version

    - name: Run RTL lint
      run: find rtl/common -name '*.sv' -exec verilator --lint-only -Wno-MULTITOP {} +
    
    - name: Verify FPGA tools installation
      run: |
        yosys --version
        nextpnr-ice40 --version
        nextpnr-ecp5 --version
        nextpnr-xilinx --version
        fasm2frames --help | head -1
        xc7frames2bit --help | head -1
        iceprog --help 2>&1 | head -1
        test -f /opt/openxc7/share/nextpnr-xilinx/xc7a35tcsg324-1.bin
    
    - name: Install Rust
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: stable
        # Disable built-in cache; use manual Cargo caching below for better control
        cache: false
    
    - name: Install RISC-V Rust Target
      run: rustup target add riscv32imafc-unknown-none-elf
    
    - name: Cache cargo dependencies and build artifacts
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-

    - name: Cache iCE40 FPGA synthesis artifacts
      id: fpga-cache-ice40
      uses: actions/cache@v4
      with:
        path: |
          rtl/fpga/build/ice40_alchitry_cu/riscv_fpga.bin
          rtl/fpga/build/ice40_alchitry_cu/riscv_fpga_timing.rpt
        key: ${{ runner.os }}-fpga-synth-ice40-${{ env.FPGA_TOOL_CACHE_VERSION }}-${{ hashFiles('rtl/**/*.sv', 'rtl/fpga/ice40_alchitry_cu/**/*.sv', 'rtl/fpga/ice40_alchitry_cu/**/*.pcf', 'rtl/fpga/Makefile') }}

    - name: Cache ECP5 FPGA synthesis artifacts
      id: fpga-cache-ecp5
      uses: actions/cache@v4
      with:
        path: |
          rtl/fpga/build/ecp5_icepi_zero/riscv_fpga.bit
        key: ${{ runner.os }}-fpga-synth-ecp5-${{ env.FPGA_TOOL_CACHE_VERSION }}-${{ hashFiles('rtl/**/*.sv', 'rtl/fpga/ecp5_icepi_zero/**/*.sv', 'rtl/fpga/ecp5_icepi_zero/**/*.lpf', 'rtl/fpga/Makefile') }}

    - name: Cache Artix-7 FPGA synthesis netlist
      id: fpga-cache-artix7
      uses: actions/cache@v4
      with:
        path: |
          rtl/fpga/build/artix7_alchitry_au/riscv_fpga.json
        key: ${{ runner.os }}-fpga-synth-artix7-${{ env.FPGA_TOOL_CACHE_VERSION }}-${{ hashFiles('rtl/**/*.sv', 'rtl/fpga/artix7_alchitry_au/**/*.sv', 'rtl/fpga/artix7_alchitry_au/**/*.xdc', 'rtl/fpga/Makefile') }}
    
    - name: Check formatting
      run: cargo fmt -- --check
    
    - name: Run clippy
      run: cargo clippy -- -D warnings
    
    - name: Check rust-test-program formatting
      working-directory: rust-test-program
      run: cargo fmt -- --check
    
    - name: Run clippy on rust-test-program
      working-directory: rust-test-program
      run: cargo clippy --release -- -D warnings

    - name: Build
      run: cargo build --verbose
    
    - name: Run tests
      run: cargo test --verbose
    
    - name: Build rust-test-program
      working-directory: rust-test-program
      run: cargo build --release --verbose
    
    - name: Verify iCE40 FPGA synthesis (cache miss)
      if: steps.fpga-cache-ice40.outputs.cache-hit != 'true'
      working-directory: rtl/fpga
      run: make TARGET=ice40_alchitry_cu

    - name: Verify cached iCE40 FPGA synthesis artifacts (cache hit)
      if: steps.fpga-cache-ice40.outputs.cache-hit == 'true'
      run: |
        test -f rtl/fpga/build/ice40_alchitry_cu/riscv_fpga.bin || (echo "Missing rtl/fpga/build/ice40_alchitry_cu/riscv_fpga.bin" && exit 1)
        test -f rtl/fpga/build/ice40_alchitry_cu/riscv_fpga_timing.rpt || (echo "Missing rtl/fpga/build/ice40_alchitry_cu/riscv_fpga_timing.rpt" && exit 1)

    - name: Verify ECP5 FPGA synthesis (cache miss)
      if: steps.fpga-cache-ecp5.outputs.cache-hit != 'true'
      working-directory: rtl/fpga
      run: make TARGET=ecp5_icepi_zero

    - name: Verify cached ECP5 FPGA synthesis artifacts (cache hit)
      if: steps.fpga-cache-ecp5.outputs.cache-hit == 'true'
      run: |
        test -f rtl/fpga/build/ecp5_icepi_zero/riscv_fpga.bit || (echo "Missing rtl/fpga/build/ecp5_icepi_zero/riscv_fpga.bit" && exit 1)

    - name: Verify Artix-7 FPGA synthesis netlist (cache miss)
      if: steps.fpga-cache-artix7.outputs.cache-hit != 'true'
      working-directory: rtl/fpga
      run: make TARGET=artix7_alchitry_au build/artix7_alchitry_au/riscv_fpga.json

    - name: Verify cached Artix-7 FPGA synthesis netlist (cache hit)
      if: steps.fpga-cache-artix7.outputs.cache-hit == 'true'
      run: |
        test -f rtl/fpga/build/artix7_alchitry_au/riscv_fpga.json || (echo "Missing rtl/fpga/build/artix7_alchitry_au/riscv_fpga.json" && exit 1)
