name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      FPGA_TOOL_CACHE_VERSION: v3
      VERIBLE_VERSION: v0.0-4053-g89d4d98a
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Cache and install system packages
      uses: awalsh128/cache-apt-pkgs-action@v1
      with:
        packages: verilator libasound2-dev libudev-dev yosys fpga-icestorm nextpnr-ice40 fpga-trellis fpga-trellis-database nextpnr-ecp5 openfpgaloader
        # Bump version (v2 -> v3) to force cache refresh
        version: v3
    
    - name: Verify Verilator installation
      run: verilator --version

    - name: Install Verible
      run: |
        set -euo pipefail
        VERIBLE_DIR="$RUNNER_TEMP/verible-${VERIBLE_VERSION}"
        curl -L --fail \
          -o "$RUNNER_TEMP/verible.tar.gz" \
          "https://github.com/chipsalliance/verible/releases/download/${VERIBLE_VERSION}/verible-${VERIBLE_VERSION}-linux-static-x86_64.tar.gz"
        rm -rf "$VERIBLE_DIR"
        mkdir -p "$VERIBLE_DIR"
        tar -xzf "$RUNNER_TEMP/verible.tar.gz" -C "$VERIBLE_DIR" --strip-components=1
        echo "$VERIBLE_DIR/bin" >> "$GITHUB_PATH"

    - name: Verify Verible installation
      run: |
        verible-verilog-format --version
        verible-verilog-lint --version

    - name: Run RTL lint
      run: find rtl/common -name '*.sv' -exec verilator --lint-only -Wno-MULTITOP {} +
    
    - name: Verify FPGA tools installation
      run: |
        yosys --version
        nextpnr-ice40 --version
        nextpnr-ecp5 --version
    
    - name: Install Rust
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: stable
        # Disable built-in cache; use manual Cargo caching below for better control
        cache: false
    
    - name: Install RISC-V Rust Target
      run: rustup target add riscv32imafc-unknown-none-elf
    
    - name: Cache cargo dependencies and build artifacts
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-

    - name: Cache iCE40 FPGA synthesis artifacts
      id: fpga-cache-ice40
      uses: actions/cache@v4
      with:
        path: |
          rtl/fpga/build/ice40_alchitry_cu/riscv_fpga.bin
        key: ${{ runner.os }}-fpga-synth-ice40-${{ env.FPGA_TOOL_CACHE_VERSION }}-${{ hashFiles('rtl/**/*.sv', 'rtl/fpga/ice40_alchitry_cu/**/*.sv', 'rtl/fpga/ice40_alchitry_cu/**/*.pcf', 'rtl/fpga/Makefile') }}

    - name: Cache ECP5 FPGA synthesis artifacts
      id: fpga-cache-ecp5
      uses: actions/cache@v4
      with:
        path: |
          rtl/fpga/build/ecp5_icepi_zero/riscv_fpga.bit
        key: ${{ runner.os }}-fpga-synth-ecp5-${{ env.FPGA_TOOL_CACHE_VERSION }}-${{ hashFiles('rtl/**/*.sv', 'rtl/fpga/ecp5_icepi_zero/**/*.sv', 'rtl/fpga/ecp5_icepi_zero/**/*.lpf', 'rtl/fpga/Makefile') }}
    
    - name: Check formatting
      run: cargo fmt -- --check
    
    - name: Run clippy
      run: cargo clippy -- -D warnings
    
    - name: Check rust-test-program formatting
      working-directory: rust-test-program
      run: cargo fmt -- --check
    
    - name: Run clippy on rust-test-program
      working-directory: rust-test-program
      run: cargo clippy --release -- -D warnings

    - name: Build
      run: cargo build --verbose
    
    - name: Run tests
      run: cargo test --verbose
    
    - name: Build rust-test-program
      working-directory: rust-test-program
      run: cargo build --release --verbose
    
    - name: Verify iCE40 FPGA synthesis (cache miss)
      if: steps.fpga-cache-ice40.outputs.cache-hit != 'true'
      working-directory: rtl/fpga
      run: make TARGET=ice40_alchitry_cu

    - name: Verify cached iCE40 FPGA synthesis artifacts (cache hit)
      if: steps.fpga-cache-ice40.outputs.cache-hit == 'true'
      run: |
        test -f rtl/fpga/build/ice40_alchitry_cu/riscv_fpga.bin || (echo "Missing rtl/fpga/build/ice40_alchitry_cu/riscv_fpga.bin" && exit 1)

    - name: Verify ECP5 FPGA synthesis (cache miss)
      if: steps.fpga-cache-ecp5.outputs.cache-hit != 'true'
      working-directory: rtl/fpga
      run: make TARGET=ecp5_icepi_zero

    - name: Verify cached ECP5 FPGA synthesis artifacts (cache hit)
      if: steps.fpga-cache-ecp5.outputs.cache-hit == 'true'
      run: |
        test -f rtl/fpga/build/ecp5_icepi_zero/riscv_fpga.bit || (echo "Missing rtl/fpga/build/ecp5_icepi_zero/riscv_fpga.bit" && exit 1)
