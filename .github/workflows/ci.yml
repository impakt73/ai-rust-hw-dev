name: CI

# RUNNER IMAGE MIGRATION (TODO — activate once .github/runner/Dockerfile is
# built and pushed to GHCR via build-runner-image.yml):
#
# Replace the three setup steps below (apt packages, Rust toolchain, RISC-V
# target) with a single `container:` key on the job, e.g.:
#
#   jobs:
#     test:
#       runs-on: ubuntu-latest
#       container:
#         image: ghcr.io/impakt73/ai-rust-hw-dev/runner:latest
#         credentials:
#           username: ${{ github.actor }}
#           password: ${{ secrets.GITHUB_TOKEN }}
#
# If the GHCR package stays private, also add `packages: read` to workflow or job
# permissions, and update the Cargo cache paths to `/usr/local/cargo/...` because
# the runner image bakes Rust into `CARGO_HOME=/usr/local/cargo`.
#
# Then delete:
#   - "Cache and install system packages" step
#   - "Verify Verilator installation" step
#   - "Install Rust" step
#   - "Install RISC-V Rust Target" step
#
# See docs/research/custom-runner-image.md for the full migration guide.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      FPGA_TOOL_CACHE_VERSION: v4
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Cache and install system packages
      uses: awalsh128/cache-apt-pkgs-action@v1
      with:
        packages: verilator libasound2-dev libudev-dev yosys fpga-trellis fpga-trellis-database nextpnr-ecp5 openfpgaloader
        version: v4
    
    - name: Verify Verilator installation
      run: verilator --version

    - name: Run RTL lint
      run: find rtl/common -name '*.sv' -exec verilator --lint-only -Wno-MULTITOP {} +
    
    - name: Verify FPGA tools installation
      run: |
        yosys --version
        nextpnr-ecp5 --version
    
    - name: Install Rust
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: stable
        # Disable built-in cache; use manual Cargo caching below for better control
        cache: false
    
    - name: Install RISC-V Rust Target
      run: rustup target add riscv32imafc-unknown-none-elf
    
    - name: Cache cargo dependencies and build artifacts
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-

    - name: Cache default FPGA synthesis artifacts
      id: fpga-cache
      uses: actions/cache@v4
      with:
        path: |
          rtl/fpga/build/ecp5_icepi_zero/riscv_fpga.bit
        key: ${{ runner.os }}-fpga-synth-ecp5-${{ env.FPGA_TOOL_CACHE_VERSION }}-${{ hashFiles('rtl/**/*.sv', 'rtl/fpga/ecp5_icepi_zero/**/*.sv', 'rtl/fpga/ecp5_icepi_zero/**/*.lpf', 'rtl/fpga/Makefile') }}
    
    - name: Check formatting
      run: cargo fmt -- --check
    
    - name: Run clippy
      run: cargo clippy -- -D warnings
    
    - name: Check rust-test-program formatting
      working-directory: rust-test-program
      run: cargo fmt -- --check
    
    - name: Run clippy on rust-test-program
      working-directory: rust-test-program
      run: cargo clippy --release -- -D warnings

    - name: Build
      run: cargo build --verbose
    
    - name: Run tests
      run: cargo test --verbose
    
    - name: Build rust-test-program
      working-directory: rust-test-program
      run: cargo build --release --verbose
    
    - name: Verify default FPGA synthesis (cache miss)
      if: steps.fpga-cache.outputs.cache-hit != 'true'
      working-directory: rtl/fpga
      run: make

    - name: Verify cached default FPGA synthesis artifacts (cache hit)
      if: steps.fpga-cache.outputs.cache-hit == 'true'
      run: |
        test -f rtl/fpga/build/ecp5_icepi_zero/riscv_fpga.bit || (echo "Missing rtl/fpga/build/ecp5_icepi_zero/riscv_fpga.bit" && exit 1)
