name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      FPGA_TOOL_CACHE_VERSION: v3
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Cache and install system packages
      uses: awalsh128/cache-apt-pkgs-action@v1
      with:
        packages: verilator libasound2-dev libudev-dev yosys fpga-icestorm nextpnr-ice40
        # Bump version (v2 -> v3) to force cache refresh
        version: v3
    
    - name: Verify Verilator installation
      run: verilator --version

    - name: Run RTL lint
      run: find rtl -name '*.sv' -exec verilator --lint-only -Wno-MULTITOP {} +
    
    - name: Verify FPGA tools installation
      run: |
        yosys --version
        nextpnr-ice40 --version
        iceprog --help 2>&1 | head -1
    
    - name: Install Rust
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: stable
        # Disable built-in cache; use manual Cargo caching below for better control
        cache: false
    
    - name: Install RISC-V Rust Target
      run: rustup target add riscv32imafc-unknown-none-elf
    
    - name: Cache cargo dependencies and build artifacts
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-

    - name: Cache FPGA synthesis artifacts
      id: fpga-cache
      uses: actions/cache@v4
      with:
        path: |
          fpga/build/riscv_fpga.bin
          fpga/build/riscv_fpga_timing.rpt
        key: ${{ runner.os }}-fpga-synth-${{ env.FPGA_TOOL_CACHE_VERSION }}-${{ hashFiles('rtl/**/*.sv', 'fpga/**/*.sv', 'fpga/**/*.pcf', 'fpga/Makefile') }}
    
    - name: Check formatting
      run: cargo fmt -- --check
    
    - name: Run clippy
      run: cargo clippy -- -D warnings
    
    - name: Check rust-test-program formatting
      working-directory: rust-test-program
      run: cargo fmt -- --check
    
    - name: Run clippy on rust-test-program
      working-directory: rust-test-program
      run: cargo clippy --release -- -D warnings

    - name: Build
      run: cargo build --verbose
    
    - name: Run tests
      run: cargo test --verbose
    
    - name: Build rust-test-program
      working-directory: rust-test-program
      run: cargo build --release --verbose
    
    - name: Verify FPGA synthesis (cache miss)
      if: steps.fpga-cache.outputs.cache-hit != 'true'
      working-directory: fpga
      run: make

    - name: Verify cached FPGA synthesis artifacts (cache hit)
      if: steps.fpga-cache.outputs.cache-hit == 'true'
      run: |
        test -f fpga/build/riscv_fpga.bin || (echo "Missing fpga/build/riscv_fpga.bin" && exit 1)
        test -f fpga/build/riscv_fpga_timing.rpt || (echo "Missing fpga/build/riscv_fpga_timing.rpt" && exit 1)
