name: Build Runner Image

# Builds and pushes the pre-baked CI/Copilot runner image to GHCR.
#
# Triggered automatically when the Dockerfile changes on main so the image
# always reflects the current tool versions.  Also dispatchable manually so
# maintainers can force a rebuild (e.g. to pick up Ubuntu security updates).
#
# The published image is used by ci.yml and copilot-setup-steps.yml via the
# `container:` key, eliminating per-job apt installs and Rust toolchain setup.
#
# See docs/research/custom-runner-image.md for the migration guide.

on:
  push:
    branches:
      - main
    paths:
      - .github/runner/Dockerfile
  workflow_dispatch:

permissions:
  contents: read
  packages: write   # Required to push to ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/runner
          tags: |
            # Tag :latest on pushes to main
            type=raw,value=latest,enable={{is_default_branch}}
            # Tag :sha-<short-sha> for traceability
            type=sha,prefix=sha-

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .github/runner
          file: .github/runner/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            REPO_URL=https://github.com/${{ github.repository }}
          # Layer caching backed by the Actions cache — keeps incremental rebuilds fast.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Print image digest
        run: |
          echo "=== Runner image built and pushed ==="
          echo "Tags:"
          echo "${{ steps.meta.outputs.tags }}"
          echo ""
          echo "To use this image in a workflow job, add:"
          echo "  container:"
          echo "    image: ghcr.io/${{ github.repository }}/runner:latest"
          echo "    credentials:"
          echo "      username: \${{ github.actor }}"
          echo "      password: \${{ secrets.GITHUB_TOKEN }}"
          echo ""
          echo "Then remove the 'Cache and install apt packages' and"
          echo "'Install Rust Toolchain' / 'Install RISC-V Rust Target' steps."
