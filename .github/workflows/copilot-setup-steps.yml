name: "Copilot Setup Steps"

# This workflow defines the setup steps required for GitHub Copilot coding agent
# to work on this RISC-V hardware verification project.
# 
# CRITICAL: The job name MUST be 'copilot-setup-steps' for Copilot to use it.

on:
  workflow_dispatch:  # Allow manual testing
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:   # REQUIRED job name - do not change!
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Cache and install apt packages
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: verilator gcc-riscv64-unknown-elf libasound2-dev libudev-dev yosys fpga-icestorm nextpnr-ice40 fpga-trellis fpga-trellis-database nextpnr-ecp5 openfpgaloader squashfs-tools patchelf cmake libboost-iostreams-dev libboost-thread-dev libboost-program-options-dev libboost-python-dev libboost-filesystem-dev libboost-system-dev libboost-regex-dev libboost-chrono-dev libboost-atomic-dev libeigen3-dev python3-pip
          # Bump version (v3 -> v4) to force cache refresh
          version: v4

      - name: Install Artix-7 (openXC7) tooling
        run: |
          sudo mkdir -p /opt/openxc7/share/nextpnr-xilinx
          wget -O /tmp/openxc7_0.8.2_amd64.snap https://github.com/openXC7/openXC7-snap/releases/download/0.8.2/openxc7_0.8.2_amd64.snap
          sudo unsquashfs -f -d /opt/openxc7 /tmp/openxc7_0.8.2_amd64.snap

          # Install prjxray python dependencies and source utility scripts for fasm2frames.
          python3 -m pip install --user git+https://github.com/f4pga/prjxray.git
          git clone --depth 1 https://github.com/f4pga/prjxray.git /tmp/prjxray-src
          sudo mv /tmp/prjxray-src /opt/openxc7/prjxray-src
          PYTHON_USER_SITE="$(python3 -c 'import site; print(site.getusersitepackages())')"

          # Promote tool binaries from the snap payload into /usr/local/bin with host loader.
          for tool in nextpnr-xilinx bbasm xc7frames2bit; do
            sudo cp "/opt/openxc7/usr/bin/${tool}" "/usr/local/bin/${tool}.real"
            sudo patchelf --set-interpreter /lib64/ld-linux-x86-64.so.2 "/usr/local/bin/${tool}.real"
            printf '%s\n' '#!/usr/bin/env bash' "LD_LIBRARY_PATH=/opt/openxc7/usr/lib/x86_64-linux-gnu:/opt/openxc7/lib/x86_64-linux-gnu exec /usr/local/bin/${tool}.real \"\$@\"" | sudo tee "/usr/local/bin/${tool}" >/dev/null
            sudo chmod +x "/usr/local/bin/${tool}"
          done

          # Wrapper for fasm2frames with prjxray-db path baked in.
          printf '%s\n' '#!/usr/bin/env bash' "PYTHONPATH=/opt/openxc7/prjxray-src:${PYTHON_USER_SITE} exec python3 /opt/openxc7/prjxray-src/utils/fasm2frames.py --db-root /opt/openxc7/opt/nextpnr-xilinx/external/prjxray-db \"\$@\"" | sudo tee /usr/local/bin/fasm2frames >/dev/null
          sudo chmod +x /usr/local/bin/fasm2frames

          # Generate Artix-7 chipdb required by nextpnr-xilinx.
          python3 /opt/openxc7/opt/nextpnr-xilinx/python/bbaexport.py --device xc7a35tcsg324-1 --bba /tmp/xc7a35tcsg324-1.bba
          bbasm -l /tmp/xc7a35tcsg324-1.bba /opt/openxc7/share/nextpnr-xilinx/xc7a35tcsg324-1.bin
          rm -f /tmp/xc7a35tcsg324-1.bba
      
      - name: Install Rust Toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          # Disable built-in cache; use manual Cargo caching below for better control
          cache: false
      
      - name: Install RISC-V Rust Target
        run: rustup target add riscv32imafc-unknown-none-elf
      
      - name: Cache Cargo dependencies and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      
      - name: Verify installations
        run: |
          verilator --version
          rustc --version
          cargo --version
          rustup target list --installed | grep riscv32imafc-unknown-none-elf
          riscv64-unknown-elf-gcc --version
          yosys --version
          nextpnr-ice40 --version
          nextpnr-ecp5 --version
          nextpnr-xilinx --version
          fasm2frames --help | head -1
          xc7frames2bit --help | head -1
          iceprog --help 2>&1 | head -1
          command -v openFPGALoader
          test -f /opt/openxc7/share/nextpnr-xilinx/xc7a35tcsg324-1.bin

      - name: Summary of installed tools
        run: |
          echo "=== Development Environment Setup Complete ==="
          echo "Verilator: $(verilator --version | head -1)"
          echo "Rust: $(rustc --version)"
          echo "Cargo: $(cargo --version)"
          echo "RISC-V Rust target: $(rustup target list --installed | grep riscv32imafc-unknown-none-elf)"
          echo "RISC-V GCC: $(riscv64-unknown-elf-gcc --version | head -1)"
          echo "Yosys: $(yosys --version | head -1)"
          echo "nextpnr-ice40: $(nextpnr-ice40 --version)"
          echo "nextpnr-ecp5: $(nextpnr-ecp5 --version)"
          echo "nextpnr-xilinx: $(nextpnr-xilinx --version)"
          echo "fasm2frames: $(command -v fasm2frames)"
          echo "xc7frames2bit: $(command -v xc7frames2bit)"
          echo "Artix-7 chipdb: /opt/openxc7/share/nextpnr-xilinx/xc7a35tcsg324-1.bin"
          echo "iceprog: $(iceprog --help 2>&1 | head -1)"
          echo "openFPGALoader: $(command -v openFPGALoader)"
          echo ""
          echo "Common commands:"
          echo "  cargo test                                   - Run all tests"
          echo "  cargo test --package cpu_verifier -- alu_test     - Run ALU tests"
          echo "  cargo test --package cpu_verifier -- regfile_test - Run register file tests"
          echo "  cargo test --package cpu_verifier -- cpu_test     - Run CPU integration tests"
          echo "  cargo fmt                                    - Format Rust code"
          echo "  cargo clippy                                 - Run linter"
          echo "  verilator --lint-only rtl/*.sv               - Lint SystemVerilog files"
          echo "  cargo clean                                  - Clean build artifacts (after RTL changes)"
          echo ""
          echo "FPGA Synthesis commands (in rtl/fpga/ directory):"
          echo "  make check-tools                             - Verify FPGA tools installed"
          echo "  make                                         - Full synthesis flow"
          echo "  make TARGET=artix7_alchitry_au build/artix7_alchitry_au/riscv_fpga.json - Artix-7 synthesis netlist"
          echo "  make timing                                  - Generate timing report"
          echo "  make clean                                   - Remove build artifacts"
          echo ""
          echo "Note: First test run is slow (~15-30s) due to Verilator compilation."
          echo "      Subsequent runs are fast (~1-2s) due to caching."
