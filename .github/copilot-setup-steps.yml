# GitHub Copilot Setup Steps
# This file defines the setup steps required to work on this RISC-V hardware verification project.

name: Setup RISC-V Hardware Development Environment

steps:
  - name: Install Verilator
    description: |
      Install Verilator (REQUIRED) - SystemVerilog simulator/compiler.
      This is the most common cause of build failures if missing.
    commands:
      - sudo apt-get update
      - sudo apt-get install -y verilator
    verification:
      - verilator --version

  - name: Install Rust Toolchain
    description: Install the Rust programming language toolchain (tested with 1.92.0+)
    commands:
      - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
      - source $HOME/.cargo/env
    verification:
      - rustc --version
      - cargo --version

  - name: Verify Dependencies
    description: Verify that all required dependencies are installed correctly
    commands:
      - verilator --version
      - rustc --version
      - cargo --version

  - name: Build Project
    description: Build the project to ensure everything is set up correctly
    commands:
      - cargo build --verbose
    verification:
      - test -d target

  - name: Run Tests
    description: Run the test suite to verify the setup (22 tests should pass)
    commands:
      - cargo test --verbose
    verification:
      - cargo test --verbose

  - name: Setup Code Quality Tools
    description: Verify code formatting and linting tools are available
    commands:
      - cargo fmt -- --check
      - cargo clippy -- -D warnings

notes: |
  For detailed information about this project, refer to:
  - AGENTS.md: Comprehensive guide for AI coding agents
  - .github/copilot-instructions.md: Quick reference for Copilot

  Common commands:
  - cargo test: Run all tests
  - cargo test --package cpu_verifier -- alu_test: Run ALU tests
  - cargo test --package cpu_verifier -- regfile_test: Run register file tests
  - cargo test --package cpu_verifier -- cpu_test: Run CPU integration tests
  - cargo fmt: Format Rust code
  - cargo clippy: Run linter
  - verilator --lint-only rtl/*.sv: Lint SystemVerilog files
  - cargo clean: Clean build artifacts (useful after RTL changes)

  Important notes:
  - First test run is slow (~15-30 seconds) due to Verilator compilation
  - Subsequent runs are fast (~1-2 seconds) due to caching
  - After changing SystemVerilog files, run 'cargo clean' before testing
  - All code should pass fmt and clippy checks before committing
